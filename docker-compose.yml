services:
  db:
    image: pgvector/pgvector:pg16
    container_name: connect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: connect
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d connect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: